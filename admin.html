<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="18" cy="32" r="14" fill="white" stroke="%230A0A0A" stroke-width="5"/><circle cx="46" cy="32" r="14" fill="white" stroke="%230A0A0A" stroke-width="5"/><circle cx="21" cy="36" r="7.5" fill="%230A0A0A"/><circle cx="49" cy="36" r="7.5" fill="%230A0A0A"/></svg>'>
<title>TEAM 23 — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="design-system/styles.css">
<style>
  :root{
    /* mismos alias del hub principal, sobre los tokens de design-system/tokens/ */
    --ink:var(--n-600);
    --paper:var(--n-000);
    --red:var(--brand-red);
    --gray:var(--tx-on-light-secondary);
    --soft:var(--n-100);
    --hair:var(--n-200);

    --fs-hero:clamp(32px,6vw,var(--text-s1-size));
    --fs-section:clamp(20px,3vw,var(--text-b3-size));
    --fs-card-title:clamp(16px,1.6vw,18px);
    --fs-body:var(--text-b1-size);
    --fs-caption:var(--text-c2-size);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--font-primary);background:var(--paper);color:var(--ink);
    font-size:var(--fs-body);line-height:1.3;letter-spacing:var(--tracking-tight);
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  ::selection{background:var(--red);color:#fff}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:var(--stroke-sm) solid var(--ink);
    padding:var(--space-4) var(--space-7);
  }
  .hrow{display:flex;align-items:center;gap:var(--space-3);flex-wrap:wrap}
  .wordmark{display:flex;align-items:center;gap:var(--space-3);color:var(--ink);text-decoration:none}
  .wordmark .t{font-family:var(--font-primary);font-weight:var(--weight-bold);font-size:22px;letter-spacing:var(--tracking-tight)}
  .eyes{display:inline-flex;gap:3px}
  .eye{width:18px;height:22px;background:#fff;border:var(--stroke-sm) solid var(--ink);border-radius:50%;position:relative}
  .pupil{width:7px;height:7px;background:var(--ink);border-radius:50%;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
  .hub-label{font-size:var(--fs-caption);letter-spacing:.14em;font-weight:var(--weight-bold);color:var(--gray)}
  .hacts{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}

  .btn{
    font-family:var(--font-secondary);font-weight:var(--weight-bold);font-size:var(--fs-caption);
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:var(--radius-full);padding:var(--space-4) var(--space-9);cursor:pointer;white-space:nowrap;
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.small{padding:var(--space-3) var(--space-5);font-size:12px}
  header .btn.small{
    font-family:var(--font-primary);text-transform:uppercase;letter-spacing:.08em;
    font-size:12px;padding:var(--space-2) var(--space-4);
  }

  /* ---------- hero ---------- */
  .hero{padding:var(--space-11) var(--space-7) var(--space-7)}
  .hero h1{
    font-family:var(--font-primary);font-weight:var(--weight-bold);font-size:var(--fs-hero);
    line-height:.92;letter-spacing:var(--tracking-tight);text-transform:uppercase;
    -webkit-text-stroke:.6px currentColor;
  }
  .kicker{font-size:var(--fs-caption);letter-spacing:.14em;font-weight:var(--weight-bold);color:var(--gray);text-transform:uppercase;margin-top:var(--space-4)}

  main{padding:var(--space-5) var(--space-7) var(--space-9);max-width:1400px}

  /* ---------- stats ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--space-4)}
  .stat{border:2px solid var(--ink);border-radius:var(--radius-lg);padding:var(--space-5);box-shadow:4px 4px 0 var(--ink)}
  .stat b{display:block;font-family:var(--font-primary);font-weight:var(--weight-bold);font-size:var(--fs-section);line-height:1}
  .stat span{display:block;margin-top:var(--space-2);font-size:var(--fs-caption);color:var(--gray);font-weight:var(--weight-bold);text-transform:uppercase;letter-spacing:.06em}

  /* ---------- Status ---------- */
  .status-block{margin-top:var(--space-8)}
  .status-block h3{
    font-family:var(--font-primary);font-weight:var(--weight-bold);font-size:var(--fs-caption);
    text-transform:uppercase;letter-spacing:.1em;color:var(--gray);margin-bottom:var(--space-4);
  }
  .venc-row{
    display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);
    padding:var(--space-3) 0;border-bottom:1px solid var(--hair);
  }
  .venc-row:last-child{border-bottom:none}
  .venc-row .pilar-tag{font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.04em}
  .venc-row .fecha{font-weight:var(--weight-bold);white-space:nowrap;flex:none}
  .venc-row .fecha.vencida{color:var(--red)}
  .carga-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--space-2) var(--space-5)}
  .carga-grid .item{font-size:var(--fs-body)}
  .carga-grid .item small{color:var(--gray)}
  .carga-grid .item.busy small{color:var(--red);font-weight:var(--weight-bold)}

  /* ---------- toolbar ---------- */
  .toolbar{display:flex;gap:var(--space-3);flex-wrap:wrap;align-items:center;margin-top:var(--space-7)}
  .toolbar input[type=text],.toolbar select{
    font-family:var(--font-primary);font-size:var(--fs-body);padding:var(--space-3);
    border:2px solid var(--ink);border-radius:var(--radius-md);background:#fff;color:var(--ink);
  }
  .toolbar input[type=text]{flex:1 1 240px;min-width:0}
  .toolbar input:focus,.toolbar select:focus{outline:3px solid var(--red);outline-offset:2px}
  .pill-opt{
    font-family:var(--font-primary);font-size:12px;font-weight:var(--weight-bold);text-transform:uppercase;letter-spacing:.06em;
    border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:var(--radius-full);
    padding:var(--space-2) var(--space-4);cursor:pointer;
  }
  .pill-opt.on{background:var(--ink);color:#fff}

  /* ---------- filtro de estado, multi-selección ---------- */
  .multisel{position:relative}
  .multisel-btn{
    font-family:var(--font-primary);font-size:var(--fs-body);padding:var(--space-3);
    border:2px solid var(--ink);border-radius:var(--radius-md);background:#fff;color:var(--ink);
    cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .multisel-btn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  .multisel-btn .car{font-size:10px;color:var(--gray)}
  .multisel-menu{
    position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:220px;
    background:#fff;border:2px solid var(--ink);border-radius:var(--radius-md);
    box-shadow:4px 4px 0 var(--ink);padding:var(--space-2);
  }
  .multisel-menu label{
    display:flex;align-items:center;gap:8px;padding:var(--space-2) var(--space-3);
    font-size:var(--fs-caption);cursor:pointer;border-radius:var(--radius-sm);
  }
  .multisel-menu label:hover{background:var(--soft)}
  .multisel-menu hr{border:none;border-top:1px solid var(--hair);margin:var(--space-2) 0}
  .multisel-menu .clear{
    display:block;width:100%;text-align:left;background:none;border:none;font-family:var(--font-primary);
    font-size:11px;color:var(--gray);text-transform:uppercase;letter-spacing:.06em;font-weight:var(--weight-bold);
    padding:var(--space-2) var(--space-3);cursor:pointer;
  }

  /* ---------- pilares ---------- */
  .pilar{margin-top:var(--space-9)}
  .section-head{
    display:flex;align-items:baseline;gap:var(--space-4);border-bottom:var(--stroke-sm) solid var(--ink);
    padding-bottom:var(--space-4);margin-bottom:var(--space-5);
  }
  .section-head h2{
    font-family:var(--font-primary);font-weight:var(--weight-bold);font-size:var(--fs-section);
    text-transform:uppercase;letter-spacing:var(--tracking-tight);
  }
  .section-head .count{font-size:var(--fs-caption);font-weight:var(--weight-bold);color:var(--gray)}

  .sector{margin-bottom:var(--space-7)}
  .sector-head{margin-bottom:var(--space-4)}
  .sector-head h3{
    font-family:var(--font-primary);font-weight:var(--weight-bold);font-size:var(--fs-caption);
    text-transform:uppercase;letter-spacing:.1em;color:var(--gray);
  }

  .grupo{border:2px solid var(--ink);border-radius:var(--radius-lg);margin-bottom:var(--space-4);overflow:hidden}
  .grupo-head{
    display:flex;align-items:center;gap:var(--space-3);padding:var(--space-4) var(--space-5);
    background:var(--soft);cursor:pointer;flex-wrap:wrap;
  }
  .grupo-head .nom{font-weight:var(--weight-bold);font-size:var(--fs-card-title)}
  .grupo-head .sub{font-size:var(--fs-caption);color:var(--gray)}
  .dd-toggle{
    width:26px;height:26px;border:2px solid var(--ink);border-radius:var(--radius-full);
    background:var(--paper);color:var(--ink);cursor:pointer;margin-left:auto;flex:none;
    display:inline-flex;align-items:center;justify-content:center;font-size:11px;
  }
  .dd-toggle.closed span{transform:rotate(-90deg)}
  .dd-toggle span{display:block;transition:transform .15s ease}

  .fila{
    display:flex;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-5);
    border-top:1px solid var(--hair);flex-wrap:wrap;
  }
  .fila .nom{flex:1 1 220px;min-width:0}
  .fila.child .nom{padding-left:var(--space-5);color:var(--gray)}

  .badge{
    font-size:11px;font-weight:var(--weight-bold);text-transform:uppercase;letter-spacing:.04em;
    padding:3px 10px;border-radius:var(--radius-full);border:1.5px solid var(--ink);white-space:nowrap;flex:none;
  }
  .b-sin{background:var(--soft)}
  .b-plan{background:var(--brand-cyan)}
  .b-curso{background:var(--brand-yellow)}
  .b-pausa{background:var(--brand-purple)}
  .b-listo{background:var(--brand-green)}
  .b-arch{background:var(--hair);color:var(--gray)}
  .b-alta{background:var(--red);border-color:var(--red);color:#fff}
  .b-media{background:var(--brand-yellow)}
  .b-baja{background:var(--paper);color:var(--gray)}
  .meta{font-size:var(--fs-caption);color:var(--gray);white-space:nowrap;flex:none}
  .meta.vencida{color:var(--red);font-weight:var(--weight-bold)}

  /* edición inline: mismo look de badge/meta, pero son controles reales */
  .badge-select{
    font-family:var(--font-primary);font-size:11px;font-weight:var(--weight-bold);text-transform:uppercase;
    letter-spacing:.04em;padding:2px 6px;border-radius:var(--radius-full);border:1.5px solid var(--ink);
    white-space:nowrap;flex:none;cursor:pointer;color:inherit;
  }
  /* estado: el color va en el stroke, no en el relleno — así no se confunde
     con prioridad, que es la única que queda rellena */
  .estado-select{background:var(--paper);color:var(--ink);border-width:2px}
  .estado-select.b-sin{border-color:var(--ink)}
  .estado-select.b-plan{border-color:var(--brand-cyan)}
  .estado-select.b-curso{border-color:var(--brand-yellow)}
  .estado-select.b-pausa{border-color:var(--brand-purple)}
  .estado-select.b-listo{border-color:var(--brand-green)}
  .estado-select.b-arch{border-color:var(--hair);color:var(--gray)}
  .edit-date{
    font-family:var(--font-primary);font-size:var(--fs-caption);color:var(--gray);border:1px solid transparent;
    background:transparent;padding:2px 4px;border-radius:var(--radius-sm);cursor:pointer;flex:none;
  }
  .edit-date:hover{border-color:var(--hair)}
  .edit-date.vencida{color:var(--red);font-weight:var(--weight-bold)}
  input.edit-nombre{
    font:inherit;color:inherit;border:1px solid transparent;background:transparent;
    padding:2px 4px;border-radius:var(--radius-sm);width:100%;
  }
  input.edit-nombre:hover{border-color:var(--hair)}
  input.edit-nombre:focus{border-color:var(--ink);outline:none}
  .del-btn{
    border:none;background:none;color:var(--gray);cursor:pointer;font-size:14px;line-height:1;
    padding:4px 6px;flex:none;
  }
  .del-btn:hover{color:var(--red)}
  .resp-btn{
    font-family:var(--font-primary);font-size:var(--fs-caption);color:var(--gray);
    border:1px solid transparent;background:transparent;padding:2px 6px;border-radius:var(--radius-sm);
    cursor:pointer;flex:none;white-space:nowrap;
  }
  .resp-btn:hover{border-color:var(--hair)}
  .resp-btn.vacio{color:var(--hair)}
  .mini-btn{
    font-family:var(--font-primary);font-size:10px;font-weight:var(--weight-bold);text-transform:uppercase;
    letter-spacing:.05em;color:var(--gray);border:1px solid var(--hair);background:var(--paper);
    padding:2px 6px;border-radius:var(--radius-full);cursor:pointer;flex:none;
  }
  .mini-btn:hover{border-color:var(--ink);color:var(--ink)}
  .vista-label{
    font-size:var(--fs-caption);font-weight:var(--weight-bold);text-transform:uppercase;
    letter-spacing:.08em;color:var(--gray);
  }
  /* el bucket que contiene el día de hoy se destaca con el rojo de alerta */
  .grupo.hoy{border-color:var(--red)}
  .grupo.hoy .grupo-head{background:#fff5f4}
  .meta.ctx{color:var(--hair);font-size:11px}
  .section-head .nueva-btn{margin-left:auto}
  .grupo.nueva{border-style:dashed}
  .campo{display:flex;flex-direction:column;gap:4px;flex:none}
  .campo > span{
    font-size:10px;font-weight:var(--weight-bold);text-transform:uppercase;
    letter-spacing:.06em;color:var(--gray);
  }
  .campo input,.campo select{
    font-family:var(--font-primary);font-size:var(--fs-caption);padding:var(--space-2) var(--space-3);
    border:2px solid var(--ink);border-radius:var(--radius-md);background:#fff;color:var(--ink);
  }
  .campo input[type=text]{width:100%}

  .empty{
    border:2px dashed var(--hair);border-radius:var(--radius-lg);padding:var(--space-7);
    text-align:center;font-size:var(--fs-caption);color:var(--gray);
  }

  footer{
    border-top:var(--stroke-sm) solid var(--ink);padding:var(--space-9) var(--space-7) var(--space-7);
    display:flex;justify-content:space-between;align-items:flex-end;gap:var(--space-5);flex-wrap:wrap;
  }
  .foot-mark-img{max-width:280px;height:auto;display:block}
  .foot-right{text-align:right;font-size:var(--fs-caption);font-weight:var(--weight-bold);line-height:1.8}
  .foot-scope{color:var(--gray);letter-spacing:.1em}

  @media (max-width:640px){
    header{padding:var(--space-3) 16px}
    .hero{padding:24px 16px 10px}
    main{padding:8px 16px 90px}
    footer{padding:40px 16px 28px;flex-direction:column;align-items:flex-start}
    .foot-right{text-align:left}
    .fila{gap:var(--space-2)}
  }
</style>
<!-- Capa de interacción: press, foco, hit area, motion y contraste.
     Va DESPUÉS del <style> de arriba a propósito: misma especificidad,
     gana la última en cargar. Ver design-system/RULES.md -->
<link rel="stylesheet" href="design-system/interaction.css">
</head>
<body>

<header>
  <div class="hrow">
    <a class="wordmark" href="/productores">
      <span class="t">TEAM 23</span>
      <span class="eyes"><span class="eye"><span class="pupil"></span></span><span class="eye"><span class="pupil"></span></span></span>
    </a>
    <span class="hub-label">PRODUCTION HUB · ADMIN</span>
    <div class="hacts">
      <a class="btn small" href="/productores">← Hub</a>
      <button class="btn small" id="btnLogout" style="display:none" onclick="authLogout()" title="Salir" aria-label="Salir"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/><path d="M16 3h3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-3"/></svg></button>
    </div>
  </div>
</header>

<div class="hero">
  <h1>Admin</h1>
  <div class="kicker">Seguimiento interno del estudio · operativa, ejecutiva y crecimiento</div>
</div>

<main>
  <span id="mainTabs" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:var(--space-6)"></span>

  <section id="view-status" hidden>
    <div class="stat-grid" id="stats"></div>
    <div class="status-block">
      <h3>Por pilar</h3>
      <div class="stat-grid" id="statusPilares"></div>
    </div>
    <div class="status-block">
      <h3>Próximos vencimientos</h3>
      <div id="statusVencimientos"></div>
    </div>
    <div class="status-block">
      <h3>Carga de trabajo</h3>
      <div id="statusCarga"></div>
    </div>
  </section>

  <section id="view-tareas" hidden>
    <div class="toolbar">
      <input type="text" id="q" placeholder="Buscar por tarea, responsable o grupo…" oninput="render()">
      <div class="multisel" id="fEstadoWrap">
        <button type="button" class="multisel-btn" onclick="toggleEstadoMenu()">
          <span id="fEstadoLabel">Todos los estados</span> <span class="car">▾</span>
        </button>
        <div class="multisel-menu" id="fEstadoMenu" hidden></div>
      </div>
      <div class="multisel" id="fRespWrap">
        <button type="button" class="multisel-btn" onclick="toggleRespMenu()">
          <span id="fRespLabel">Todos los responsables</span> <span class="car">▾</span>
        </button>
        <div class="multisel-menu" id="fRespMenu" hidden></div>
      </div>
      <span id="pilarTabs" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    </div>
    <div class="toolbar" style="margin-top:var(--space-3)">
      <span class="vista-label">Vista</span>
      <span id="vistaTabs" style="display:flex;gap:6px;flex-wrap:wrap"></span>
    </div>

    <div id="body"></div>
  </section>
</main>

<div id="toast" role="status"></div>
<div class="multisel-menu" id="respEditMenu" style="position:fixed" hidden></div>

<footer>
  <div>
    <img class="foot-mark-img" src="assets/footer-mark.png" alt="biz@team23.online — Creative direction, (Post) producción, New media lab">
  </div>
  <div class="foot-right">
    <div class="foot-scope">MX — ARG — WORLDWIDE</div>
    <div>TEAM 23 © <span id="yr"></span></div>
  </div>
</footer>

<script>
/* ================================================================
   CONFIG — mismos valores que el resto del hub.
   N8N_BASE vacío ⇒ modo demo con el seguimiento ya cargado.
================================================================ */
const CONFIG = {
  N8N_BASE: "https://coordteam23.app.n8n.cloud",
  API_KEY: "coordHUBt23",
  SUPABASE_URL: "https://muvmrkacjhygfuialpyn.supabase.co",
  SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im11dm1ya2Fjamh5Z2Z1aWFscHluIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQzMTM4NDQsImV4cCI6MjA5OTg4OTg0NH0.zapojPWo2GXKz7ryfxxWJxsTkocUxjL1ocTgOd9TlgI"
};
const DEMO = !CONFIG.N8N_BASE;
const AUTH_ON = !!CONFIG.SUPABASE_URL;

const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const PILARES = [
  { key:"operativa",   label:"01 · Operativa / Producción" },
  { key:"ejecutiva",   label:"02 · Ejecutiva" },
  { key:"crecimiento", label:"03 · Crecimiento" }
];
/* sectores oficiales por pilar (organigrama del estudio), en el orden en que
   se tienen que mostrar. Cada tarea raíz (sin grupo) trae su sector asignado
   en el SEED/en la base — esto solo define el orden y qué nombres son válidos. */
const SECTORES = {
  operativa:   ["Producción & Operación","Técnico","Creativo"],
  ejecutiva:   ["Administración & Finanzas","Legal","RRHH"],
  crecimiento: ["Marketing","Comercial","Innovación"]
};
const ESTADOS = ["Sin empezar","Planificación","En curso","En pausa","Listo","Archivadas"];
const ESTADO_CLASS = {"Sin empezar":"b-sin","Planificación":"b-plan","En curso":"b-curso","En pausa":"b-pausa","Listo":"b-listo","Archivadas":"b-arch"};
const PRIO_CLASS = {"Alta":"b-alta","Media":"b-media","Baja":"b-baja"};

/* "responsable" es texto libre y mezcla una o varias personas por fila
   ("Mile Teo", "Mile - Kr - Knd", "Teo y Narf"...). RESP_ALIAS mapea cada
   forma en que aparece un nombre a su forma canónica, y parseResponsables()
   separa el campo en la lista real de personas — así el filtro encuentra a
   Karla sea que la fila diga "Karla", "Krla", "Krl" o "Kr". */
const RESP_ALIAS = {
  "mile":"Mile", "milena":"Mile",
  "teo":"Teo",
  "narf":"Narf",
  "karla":"Karla", "krla":"Karla", "krl":"Karla", "kr":"Karla",
  "knd":"Knd",
  "juli":"Juli",
  "maya":"Maya",
  "team":"TEAM 23", "team23":"TEAM 23"
};
/* orden de prioridad combinado entre pilares (Operativa: Narf, Teo, Mile ·
   Ejecutiva: Krla, Mile, Knd, Teo, Narf) para ordenar el desplegable */
const RESP_ORDEN = ["Narf","Teo","Mile","Karla","Knd","Juli","Maya","TEAM 23"];
function parseResponsables(raw){
  if(!raw) return [];
  const tokens = raw.toLowerCase().split(/[\s\-\/,]+|\by\b/).map(t=>t.trim()).filter(Boolean);
  const out = [];
  tokens.forEach(t=>{ const c = RESP_ALIAS[t]; if(c && !out.includes(c)) out.push(c); });
  return out;
}

let tasks = [];
let pilarFilter = "all";
/* grupos colapsados: arrancan cerrados salvo los que el usuario abra */
const abiertos = new Set();
/* filtro de estado: set vacío = "todos". con 1 o más elegidos, filtra por esa selección */
const estadoFilter = new Set();
/* filtro de responsables: mismo patrón que estadoFilter */
const respFilter = new Set();

/* ---------- datos ---------- */
async function api(path, opts={}){
  const r = await fetch(CONFIG.N8N_BASE.replace(/\/$/,"") + path, {
    ...opts,
    headers: { "Content-Type":"application/json", "x-team23-key": CONFIG.API_KEY, ...(opts.headers||{}) }
  });
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}

async function loadTasks(){
  if(DEMO){ tasks = SEED.slice(); return; }
  const data = await api("/webhook/team23/admin-tasks");
  tasks = data.tasks || [];
}

let toastTimer;
function toast(msg, err=false){
  const t = $("#toast");
  t.textContent = msg; t.className = err?"err show":"show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove("show"), 4200);
}

/* edición inline de estado/fecha: optimista (actualiza y re-renderiza al toque),
   revierte si falla el guardado. En demo no hay backend — solo cambia en memoria. */
async function updateTask(id, field, value){
  const t = tasks.find(x=>String(x.id)===String(id));
  if(!t) return;
  const prev = t[field];
  t[field] = value;
  render();
  if(DEMO){ toast("Cambio guardado (modo demo, no persiste)."); return; }
  try{
    await api("/webhook/team23/admin-update-task", { method:"POST", body: JSON.stringify({ id, [field]: value }) });
    toast("Guardado.");
  }catch(e){
    t[field] = prev;
    render();
    toast("No pude guardar el cambio: "+e.message, true);
  }
}

/* borrar una raíz se lleva sus subtareas con ella (quedarían huérfanas: un
   .grupo se arma por nombre de grupo, así que sin la raíz dejarían de verse
   en cualquier lado, no solo perderían su encabezado) */
function deleteTask(id){
  const t = tasks.find(x=>String(x.id)===String(id));
  if(!t) return;
  const hijos = t.grupo ? [] : tasks.filter(x=>x.grupo===t.nombre);
  const msg = hijos.length
    ? `¿Eliminar "${t.nombre}" y sus ${hijos.length} subtareas? No se puede deshacer.`
    : `¿Eliminar "${t.nombre}"? No se puede deshacer.`;
  if(!confirm(msg)) return;
  doDeleteTask(t, hijos);
}
async function doDeleteTask(t, hijos){
  const idsBorrados = [t.id, ...hijos.map(h=>h.id)];
  const prevTasks = tasks.slice();
  tasks = tasks.filter(x=>!idsBorrados.includes(x.id));
  render();
  if(DEMO){ toast("Eliminado (modo demo, no persiste)."); return; }
  try{
    for(const id of idsBorrados){
      await api("/webhook/team23/admin-delete-task", { method:"POST", body: JSON.stringify({ id }) });
    }
    toast("Eliminado.");
  }catch(e){
    tasks = prevTasks;
    render();
    toast("No pude eliminar: "+e.message, true);
  }
}

/* ---------- render ---------- */
function fechaCorta(d){
  if(!d) return "";
  const [y,m,day] = d.split("-");
  return `${day}/${m}/${String(y).slice(2)}`;
}
/* la fecha que vale como vencimiento es el fin del rango si lo hay, y si no
   el deadline suelto */
function fechaLimite(t){ return t.fin || t.deadline || ""; }
function estaVencida(t){
  const ref = fechaLimite(t);
  if(!ref || t.estado === "Listo" || t.estado === "Archivadas") return false;
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const [y,m,d] = ref.split("-").map(Number);
  return new Date(y, m-1, d) < hoy;
}

const PRIORIDADES = ["Alta","Media","Baja"];
function badges(t){
  let out = `<select class="badge-select estado-select ${ESTADO_CLASS[t.estado]||"b-sin"}" onclick="event.stopPropagation()" onchange="updateTask('${t.id}','estado',this.value)">` +
    ESTADOS.map(e=>`<option value="${esc(e)}" ${e===t.estado?"selected":""}>${esc(e)}</option>`).join("") +
    `</select>`;
  out += `<select class="badge-select ${PRIO_CLASS[t.prioridad]||""}" onclick="event.stopPropagation()" onchange="updateTask('${t.id}','prioridad',this.value)">` +
    `<option value="" ${!t.prioridad?"selected":""}>Sin prioridad</option>` +
    PRIORIDADES.map(p=>`<option value="${p}" ${p===t.prioridad?"selected":""}>${p}</option>`).join("") +
    `</select>`;
  return out;
}
/* rangos abiertos a mano: estado sólo de UI, no se persiste — igual que `abiertos` */
const rangoAbierto = new Set();
function fechaHTML(t){
  let out = `<input type="date" class="edit-date ${estaVencida(t)?"vencida":""}" value="${t.deadline||""}" onclick="event.stopPropagation()" onchange="updateTask('${t.id}','deadline',this.value)">`;
  if(t.fin || rangoAbierto.has(String(t.id))){
    out += `<span class="meta">→</span>` +
      `<input type="date" class="edit-date ${estaVencida(t)?"vencida":""}" value="${t.fin||""}" onclick="event.stopPropagation()" onchange="updateTask('${t.id}','fin',this.value)">`;
  } else {
    out += `<button type="button" class="mini-btn" title="Convertir en rango de días" onclick="event.stopPropagation(); rangoAbierto.add('${t.id}'); render()">+ rango</button>`;
  }
  return out;
}
function metaHTML(t){
  return fechaHTML(t) + respButton(t);
}
/* responsables: un solo popover compartido y reposicionado, en vez de 237
   menús escondidos en el DOM. Vive fuera de #body para sobrevivir al render. */
let respEditandoId = null;
function respButton(t){
  const lista = parseResponsables(t.responsable);
  const label = lista.length ? esc(lista.join(", ")) : "Sin asignar";
  return `<button type="button" class="resp-btn${lista.length?"":" vacio"}" onclick="event.stopPropagation(); abrirRespEditor('${t.id}', this)">${label}</button>`;
}
function abrirRespEditor(id, btn){
  const menu = $("#respEditMenu");
  if(respEditandoId === String(id) && !menu.hidden){ cerrarRespEditor(); return; }
  respEditandoId = String(id);
  renderRespEditor();
  const r = btn.getBoundingClientRect();
  menu.style.top = (r.bottom + 6) + "px";
  menu.style.left = Math.min(r.left, window.innerWidth - 240) + "px";
  menu.hidden = false;
}
function renderRespEditor(){
  const t = tasks.find(x=>String(x.id)===respEditandoId);
  if(!t) return;
  const actuales = new Set(parseResponsables(t.responsable));
  $("#respEditMenu").innerHTML = RESP_ORDEN.map(r=>`
    <label>
      <input type="checkbox" ${actuales.has(r)?"checked":""} onchange="toggleTaskResp('${r}')">
      ${esc(r)}
    </label>`).join("");
}
function toggleTaskResp(r){
  const t = tasks.find(x=>String(x.id)===respEditandoId);
  if(!t) return;
  const actuales = new Set(parseResponsables(t.responsable));
  actuales.has(r) ? actuales.delete(r) : actuales.add(r);
  updateTask(t.id, "responsable", RESP_ORDEN.filter(x=>actuales.has(x)).join(", "));
  renderRespEditor();
}
function cerrarRespEditor(){
  respEditandoId = null;
  const menu = $("#respEditMenu");
  if(menu) menu.hidden = true;
}
document.addEventListener("click", e => {
  const menu = $("#respEditMenu");
  if(menu && !menu.hidden && !menu.contains(e.target) && !e.target.closest(".resp-btn")) cerrarRespEditor();
});

function nombreInput(t){
  return `<input type="text" class="nom edit-nombre" value="${esc(t.nombre)}" onclick="event.stopPropagation()" onchange="updateTask('${t.id}','nombre',this.value)">`;
}
function delBtn(id){
  return `<button type="button" class="del-btn" title="Eliminar" aria-label="Eliminar" onclick="event.stopPropagation(); deleteTask('${id}')">✕</button>`;
}

function renderStats(list){
  const c = {};
  ESTADOS.forEach(e => c[e] = list.filter(t=>t.estado===e).length);
  const vencidas = list.filter(estaVencida).length;
  $("#stats").innerHTML = [
    ["En curso", c["En curso"]],
    ["Planificación", c["Planificación"]],
    ["Sin empezar", c["Sin empezar"]],
    ["Listas", c["Listo"]],
    ["Vencidas", vencidas]
  ].map(([label,n]) => `<div class="stat"><b>${n}</b><span>${esc(label)}</span></div>`).join("");
}

function matches(t, q, estados, resps){
  if(estados.size && !estados.has(t.estado)) return false;
  if(resps.size && !parseResponsables(t.responsable).some(r=>resps.has(r))) return false;
  if(!q) return true;
  return [t.nombre, t.responsable, t.grupo].filter(Boolean).join(" ").toLowerCase().includes(q);
}

/* ---------- pestaña principal: Status vs Tareas ---------- */
const MAIN_VIEWS = [
  { key:"status", label:"Status" },
  { key:"tareas", label:"Tareas" }
];
let mainView = "status";
function setMainView(v){ mainView = v; render(); }

/* ---------- vistas por tiempo ---------- */
const VISTAS = [
  { key:"pilar",  label:"Por pilar" },
  { key:"semana", label:"Esta semana" },
  { key:"mes",    label:"Este mes" }
];
let vista = "pilar";
function setVista(v){ vista = v; render(); }

const DIAS = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const PILAR_LABEL = Object.fromEntries(PILARES.map(p=>[p.key,p.label]));
function ymd(d){
  const m = String(d.getMonth()+1).padStart(2,"0"), dd = String(d.getDate()).padStart(2,"0");
  return `${d.getFullYear()}-${m}-${dd}`;
}
function addDias(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
/* la semana arranca el lunes */
function inicioSemana(d){
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return x;
}

function tiempoHTML(lista, modo){
  const hoy = new Date(); hoy.setHours(0,0,0,0);
  const conFecha = lista.filter(t => fechaLimite(t));

  const buckets = [];
  if(modo === "semana"){
    const ini = inicioSemana(hoy);
    for(let i=0;i<7;i++){
      const d = addDias(ini,i);
      buckets.push({ label:`${DIAS[i]} ${d.getDate()}/${d.getMonth()+1}`, desde:ymd(d), hasta:ymd(d), hoy:ymd(d)===ymd(hoy) });
    }
  } else {
    const ultimo = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0);
    let cursor = inicioSemana(new Date(hoy.getFullYear(), hoy.getMonth(), 1));
    while(cursor <= ultimo){
      const fin = addDias(cursor,6);
      buckets.push({
        label:`${cursor.getDate()}/${cursor.getMonth()+1} → ${fin.getDate()}/${fin.getMonth()+1}`,
        desde:ymd(cursor), hasta:ymd(fin),
        hoy: ymd(hoy) >= ymd(cursor) && ymd(hoy) <= ymd(fin)
      });
      cursor = addDias(cursor,7);
    }
  }

  const fila = t => `
    <div class="fila">
      ${nombreInput(t)}
      <span class="meta ctx">${esc(PILAR_LABEL[t.pilar]||t.pilar)}${t.grupo?" · "+esc(t.grupo):""}</span>
      ${badges(t)}${metaHTML(t)}${delBtn(t.id)}
    </div>`;

  const caja = (label, items, destacado) => !items.length ? "" : `
    <div class="grupo${destacado?" hoy":""}">
      <div class="grupo-head" style="cursor:default">
        <span class="nom">${esc(label)}</span>
        <span class="sub">${items.length} ${items.length===1?"tarea":"tareas"}</span>
      </div>
      <div>${items.map(fila).join("")}</div>
    </div>`;

  /* lo que venció antes del período y sigue abierto no se puede esconder */
  const vencidas = conFecha.filter(t =>
    fechaLimite(t) < buckets[0].desde && t.estado !== "Listo" && t.estado !== "Archivadas");

  const cuerpo = caja("Vencidas", vencidas, false) +
    buckets.map(b => caja(b.label, conFecha.filter(t => {
      const f = fechaLimite(t);
      return f >= b.desde && f <= b.hasta;
    }), b.hoy)).join("");

  const sinFecha = lista.length - conFecha.length;
  const nota = sinFecha
    ? `<div class="empty">${sinFecha} ${sinFecha===1?"tarea sin fecha queda":"tareas sin fecha quedan"} fuera de esta vista — se ven en "Por pilar".</div>`
    : "";

  return (cuerpo || `<div class="empty">Sin tareas con fecha en este período.</div>`) + nota;
}

/* Status: panorama sin filtros — cuenta todo, no solo lo que matchea el
   buscador/filtros de la pestaña Tareas (que ni siquiera están visibles acá) */
function renderStatusView(){
  renderStats(tasks);

  $("#statusPilares").innerHTML = PILARES.map(p=>{
    const n = tasks.filter(t=>t.pilar===p.key).length;
    return `<div class="stat"><b>${n}</b><span>${esc(p.label)}</span></div>`;
  }).join("");

  const activas = tasks.filter(t => t.estado!=="Listo" && t.estado!=="Archivadas");

  const conFecha = activas
    .filter(t => fechaLimite(t))
    .map(t => { const [y,m,d] = fechaLimite(t).split("-").map(Number); return { t, d: new Date(y,m-1,d) }; })
    .sort((a,b) => a.d - b.d);
  $("#statusVencimientos").innerHTML = conFecha.length
    ? conFecha.slice(0,8).map(({t}) => `
      <div class="venc-row">
        <span>${esc(t.nombre)} <span class="pilar-tag">· ${esc(PILAR_LABEL[t.pilar]||t.pilar)}</span></span>
        <span class="fecha ${estaVencida(t)?"vencida":""}">${fechaCorta(fechaLimite(t))}</span>
      </div>`).join("")
    : `<div class="empty">Sin vencimientos próximos.</div>`;

  /* "sobrecargado" es la misma idea que en el hub: más de una manito llena de
     tareas sin cerrar amerita destacarse en rojo */
  const carga = RESP_ORDEN
    .map(r => [r, activas.filter(t => parseResponsables(t.responsable).includes(r)).length])
    .filter(([,n]) => n>0)
    .sort((a,b) => b[1]-a[1]);
  $("#statusCarga").innerHTML = carga.length
    ? `<div class="carga-grid">${carga.map(([r,n]) => `
        <div class="item ${n>4?"busy":""}">${esc(r)} <small>(${n} tarea${n>1?"s":""})</small></div>`).join("")}</div>`
    : `<div class="empty">Nadie tiene tareas activas asignadas.</div>`;
}

function render(){
  $("#mainTabs").innerHTML = MAIN_VIEWS
    .map(v=>`<button class="pill-opt ${mainView===v.key?"on":""}" onclick="setMainView('${v.key}')">${esc(v.label)}</button>`).join("");
  $("#view-status").hidden = mainView !== "status";
  $("#view-tareas").hidden = mainView !== "tareas";
  if(mainView === "status"){ renderStatusView(); return; }

  const q = $("#q").value.trim().toLowerCase();
  $("#fEstadoLabel").textContent = estadoLabel();
  $("#fRespLabel").textContent = respLabel();
  const estado = estadoFilter;
  const resp = respFilter;

  const visibles = tasks.filter(t => matches(t, q, estado, resp));

  $("#pilarTabs").innerHTML = [{key:"all",label:"Todos"}, ...PILARES]
    .map(p=>`<button class="pill-opt ${pilarFilter===p.key?"on":""}" onclick="setPilar('${p.key}')">${esc(p.label)}</button>`).join("");

  $("#vistaTabs").innerHTML = VISTAS
    .map(v=>`<button class="pill-opt ${vista===v.key?"on":""}" onclick="setVista('${v.key}')">${esc(v.label)}</button>`).join("");

  /* vistas por tiempo: se agrupa por día/semana según el vencimiento, no por
     pilar, y se aplana la jerarquía (una tarea con fecha importa por su fecha,
     no por dónde cuelga) */
  if(vista !== "pilar"){
    const base = pilarFilter === "all" ? visibles : visibles.filter(t=>t.pilar===pilarFilter);
    $("#body").innerHTML = tiempoHTML(base, vista);
    return;
  }

  const pilares = pilarFilter === "all" ? PILARES : PILARES.filter(p=>p.key===pilarFilter);
  const filtrando = !!q || estado.size > 0 || resp.size > 0;

  const html = pilares.map(p => {
    const delPilar = tasks.filter(t => t.pilar === p.key);
    const raices = delPilar.filter(t => !t.grupo);

    const grupoHTML = root => {
      const hijos = delPilar.filter(t => t.grupo === root.nombre);
      const rootOk = matches(root, q, estado, resp);
      const hijosOk = hijos.filter(h => matches(h, q, estado, resp));
      /* con filtro activo, un grupo se muestra si matchea él o alguno de sus hijos */
      if(filtrando && !rootOk && !hijosOk.length) return "";

      const mostrar = filtrando ? hijosOk : hijos;
      const open = abiertos.has(root.id) || (filtrando && hijosOk.length);
      const filas = mostrar.map(h => `
        <div class="fila child">
          ${nombreInput(h)}
          ${badges(h)}${metaHTML(h)}${delBtn(h.id)}
        </div>`).join("");

      return `<div class="grupo">
        <div class="grupo-head" onclick="toggleGrupo('${root.id}')">
          ${nombreInput(root)}
          ${hijos.length ? `<span class="sub">${filtrando ? mostrar.length+" de "+hijos.length : hijos.length} ${hijos.length===1?"subtarea":"subtareas"}</span>` : ""}
          ${badges(root)}${metaHTML(root)}${delBtn(root.id)}
          ${hijos.length ? `<button class="dd-toggle${open?"":" closed"}" tabindex="-1" aria-label="Desplegar"><span>▾</span></button>` : ""}
        </div>
        ${hijos.length ? `<div style="${open?"":"display:none"}">${filas}</div>` : ""}
      </div>`;
    };

    /* dentro de cada pilar, las raíces se agrupan por sector (el área real del
       organigrama del estudio) y esos sectores se muestran en un orden fijo,
       no alfabético ni por como vinieron en la planilla */
    const sectoresHTML = SECTORES[p.key].map(sectorName => {
      const raicesSector = raices.filter(r => r.sector === sectorName);
      const grupos = raicesSector.map(grupoHTML).filter(Boolean).join("");
      if(filtrando && !grupos) return "";
      return `<div class="sector">
        <div class="sector-head"><h3>${esc(sectorName)}</h3></div>
        ${grupos || `<div class="empty">Sin tareas en ${esc(sectorName)}.</div>`}
      </div>`;
    }).join("");

    const n = delPilar.filter(t => matches(t, q, estado, resp)).length;
    return `<section class="pilar">
      <div class="section-head">
        <h2>${esc(p.label)}</h2><span class="count">(${n})</span>
        <button type="button" class="btn small nueva-btn" onclick="toggleNueva('${p.key}')">${nuevaAbierta.has(p.key)?"Cancelar":"+ Nueva tarea"}</button>
      </div>
      ${nuevaAbierta.has(p.key) ? nuevaFormHTML(p.key, raices) : ""}
      ${sectoresHTML || `<div class="empty">Sin tareas que coincidan con el filtro.</div>`}
    </section>`;
  }).join("");

  $("#body").innerHTML = html;
}

function setPilar(k){ pilarFilter = k; render(); }
function toggleGrupo(id){ abiertos.has(id) ? abiertos.delete(id) : abiertos.add(id); render(); }

/* ---------- alta de tarea ---------- */
const nuevaAbierta = new Set();
/* los responsables del alta viven acá hasta que se crea la tarea: todavía no
   hay id contra el cual guardarlos */
let nuevaResp = new Set();
function toggleNueva(pilarKey){
  nuevaAbierta.has(pilarKey) ? nuevaAbierta.delete(pilarKey) : nuevaAbierta.add(pilarKey);
  nuevaResp = new Set();
  render();
}
function nuevaFormHTML(pilarKey, raices){
  const id = s => `nt-${s}-${pilarKey}`;
  return `<div class="grupo nueva">
    <div class="fila" style="align-items:flex-end">
      <label class="campo" style="flex:1 1 240px">
        <span>Tarea</span>
        <input type="text" id="${id('nombre')}" placeholder="Qué hay que hacer">
      </label>
      <label class="campo">
        <span>Sector</span>
        <select id="${id('sector')}">
          ${SECTORES[pilarKey].map(s=>`<option value="${esc(s)}">${esc(s)}</option>`).join("")}
        </select>
      </label>
      <label class="campo">
        <span>Grupo</span>
        <select id="${id('grupo')}">
          <option value="">Sin grupo</option>
          ${raices.map(r=>`<option value="${esc(r.nombre)}" data-sector="${esc(r.sector)}">${esc(r.nombre)}</option>`).join("")}
        </select>
      </label>
      <label class="campo">
        <span>Estado</span>
        <select id="${id('estado')}">${ESTADOS.map(e=>`<option ${e==="Sin empezar"?"selected":""}>${esc(e)}</option>`).join("")}</select>
      </label>
      <label class="campo">
        <span>Prioridad</span>
        <select id="${id('prioridad')}"><option value="">Sin prioridad</option>${PRIORIDADES.map(p=>`<option>${p}</option>`).join("")}</select>
      </label>
      <label class="campo">
        <span>Deadline</span>
        <input type="date" id="${id('deadline')}">
      </label>
      <label class="campo">
        <span>Fin (opcional)</span>
        <input type="date" id="${id('fin')}">
      </label>
      <label class="campo">
        <span>Responsables</span>
        <button type="button" class="multisel-btn" onclick="abrirNuevaResp(this)">
          <span>${nuevaResp.size ? esc([...nuevaResp].join(", ")) : "Sin asignar"}</span> <span class="car">▾</span>
        </button>
      </label>
      <button type="button" class="btn small primary" onclick="crearTarea('${pilarKey}')">Crear</button>
    </div>
  </div>`;
}
/* reusa el mismo popover que las filas, pero escribiendo en nuevaResp */
function abrirNuevaResp(btn){
  const menu = $("#respEditMenu");
  if(respEditandoId === "__nueva__" && !menu.hidden){ cerrarRespEditor(); return; }
  respEditandoId = "__nueva__";
  menu.innerHTML = RESP_ORDEN.map(r=>`
    <label>
      <input type="checkbox" ${nuevaResp.has(r)?"checked":""} onchange="toggleNuevaResp('${r}')">
      ${esc(r)}
    </label>`).join("");
  const r = btn.getBoundingClientRect();
  menu.style.top = (r.bottom + 6) + "px";
  menu.style.left = Math.min(r.left, window.innerWidth - 240) + "px";
  menu.hidden = false;
}
function toggleNuevaResp(r){
  nuevaResp.has(r) ? nuevaResp.delete(r) : nuevaResp.add(r);
  render();
}
async function crearTarea(pilarKey){
  const val = s => { const el = $(`#nt-${s}-${pilarKey}`); return el ? el.value.trim() : ""; };
  const nombre = val("nombre");
  if(!nombre){ toast("Ponele un nombre a la tarea.", true); return; }
  const grupo = val("grupo");
  /* una subtarea hereda el sector de su grupo (así no se puede desalinear);
     una tarea suelta usa lo que se eligió en el select de Sector */
  const rootDelGrupo = grupo ? tasks.find(t => t.pilar===pilarKey && !t.grupo && t.nombre===grupo) : null;
  const sector = rootDelGrupo ? rootDelGrupo.sector : val("sector");
  const nueva = {
    id: "t"+Date.now(),
    pilar: pilarKey,
    sector,
    grupo,
    nombre,
    estado: val("estado") || "Sin empezar",
    prioridad: val("prioridad"),
    deadline: val("deadline"),
    fin: val("fin"),
    responsable: RESP_ORDEN.filter(x=>nuevaResp.has(x)).join(", "),
    origen: "Admin",
    depth: grupo ? 1 : 0
  };
  tasks.push(nueva);
  nuevaAbierta.delete(pilarKey);
  nuevaResp = new Set();
  render();
  if(DEMO){ toast("Tarea creada (modo demo, no persiste)."); return; }
  try{
    await api("/webhook/team23/admin-create-task", { method:"POST", body: JSON.stringify(nueva) });
    toast("Tarea creada.");
  }catch(e){
    tasks = tasks.filter(t=>t.id !== nueva.id);
    render();
    toast("No pude crear la tarea: "+e.message, true);
  }
}


/* ---------- auth ---------- */
let sb = null;
async function authLogout(){ if(sb) await sb.auth.signOut(); location.replace("/login"); }

/* acceso restringido: no es "todo interno" como el resto del hub, es solo
   este puñado de mails. Lista a mano en vez de un subrol en Supabase porque
   hoy son cinco personas fijas — si esto crece, conviene pasar a subrol=admin. */
const ADMIN_MAILS = ["narf@team23.online","teo@team23.online","krl@team23.online","milena@team23.online","biz@team23.online"];

async function boot(){
  $("#yr").textContent = new Date().getFullYear();

  if(AUTH_ON){
    try{
      const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
      sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
      const { data:{ session } } = await sb.auth.getSession();
      if(!session){ location.replace("/login"); return; }
      const { data } = await sb.from("profiles").select("role,subrol").eq("id", session.user.id).single();
      const mail = (session.user.email||"").toLowerCase();
      if(!data || data.role !== "interno" || !ADMIN_MAILS.includes(mail)){ location.replace("/productores"); return; }
      $("#btnLogout").style.display = "inline-flex";
    }catch(e){ /* si el login falla, la página queda visible solo en local */ }
  }

  try{ await loadTasks(); }
  catch(e){ $("#body").innerHTML = `<div class="empty">No pude cargar el seguimiento (${esc(e.message)}).</div>`; return; }

  render();
}
