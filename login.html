<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><circle cx="18" cy="32" r="14" fill="white" stroke="%230A0A0A" stroke-width="5"/><circle cx="46" cy="32" r="14" fill="white" stroke="%230A0A0A" stroke-width="5"/><circle cx="21" cy="36" r="7.5" fill="%230A0A0A"/><circle cx="49" cy="36" r="7.5" fill="%230A0A0A"/></svg>'>
<title>TEAM 23 · Acceso</title>
<link rel="stylesheet" href="design-system/styles.css">
<style>
  /* --- base compartida, copiada de index.html: el login es autosuficiente --- */
  :root{
    /* app-level aliases onto the TEAM 23 design-system tokens (design-system/tokens/) */
    --ink:var(--n-600);
    --paper:var(--n-000);
    --red:var(--brand-red);
    --gray:var(--tx-on-light-secondary);
    --soft:var(--n-100);
    --hair:var(--n-200);

    /* type-scale rungs used across the hub — compact end of the DS scale,
       capped at the token for that step (a dense dashboard uses the low rungs,
       Header/Display sizes stay reserved for real marketing moments) */
    --fs-hero:clamp(32px,6vw,var(--text-s1-size));       /* Subtitle S1 (48) · page title */
    --fs-section:clamp(20px,3vw,var(--text-b3-size));    /* Body B3 (32) · section heads */
    --fs-modal-title:clamp(24px,3.6vw,var(--text-s1-size)); /* Subtitle S1 (48) · modal titles */
    --fs-card-title:clamp(16px,1.6vw,18px);              /* ~Body B1 (16) · card / component titles */
    --fs-body:var(--text-b1-size);   /* Body B1 · buttons, inputs, running text */
    --fs-caption:var(--text-c2-size); /* Caption C2 · labels, meta, kickers */
  }
  .kicker{font-size:var(--fs-caption);letter-spacing:.16em;font-weight:var(--weight-bold);color:var(--gray);text-transform:uppercase;margin-bottom:var(--space-5)}
  .btn{
    font-family:var(--font-secondary);font-weight:var(--weight-bold);font-size:var(--fs-caption);
    border:var(--stroke-sm) solid var(--ink);background:var(--paper);color:var(--ink);
    border-radius:var(--radius-full);padding:var(--space-4) var(--space-9);cursor:pointer;
    transition:transform .15s ease, background .15s ease, color .15s ease;
    white-space:nowrap;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
  .btn.small{padding:var(--space-3) var(--space-5);font-size:12px}
  input[type=text],input[type=email],input[type=password],input[type=tel],input[type=date],select,textarea{
    width:100%;font-family:var(--font-primary);font-size:var(--fs-body);padding:var(--space-3) var(--space-3);
    border:2px solid var(--ink);border-radius:var(--radius-md);background:#fff;color:var(--ink);
  }
  input:focus,select:focus,textarea:focus{outline:3px solid rgba(255,0,0,.35)}
  body{font-family:var(--font-primary);color:var(--ink);letter-spacing:var(--tracking-tight);display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#fff}
  .login-card{width:min(430px,92vw);border:2px solid var(--ink);border-radius:var(--radius-lg,16px);padding:30px;box-shadow:8px 8px 0 var(--ink);background:#fff}
  .login-card input{width:100%;box-sizing:border-box}
  .lg-or{font-size:10px;letter-spacing:.18em;color:var(--gray);text-align:center;margin:14px 0}
  .lg-msg{font-size:14px;line-height:1.5;margin:0 0 14px}
  .lg-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:10}
  .lg-toast.err{background:var(--red,#FF2B1E)}
</style>
<!-- Capa de interacción: press, foco, hit area, motion y contraste.
     Va DESPUÉS del <style> de arriba a propósito: misma especificidad,
     gana la última en cargar. Ver design-system/RULES.md -->
<link rel="stylesheet" href="design-system/interaction.css">
</head>
<body>
<div class="login-card">
  <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px">
    <span style="font-family:var(--font-primary);font-weight:var(--weight-bold);font-size:24px;letter-spacing:var(--tracking-tight)">TEAM 23</span>
    <svg width="34" height="22" viewBox="0 0 64 40" aria-hidden="true"><circle cx="18" cy="20" r="14" fill="white" stroke="#0A0A0A" stroke-width="5"/><circle cx="46" cy="20" r="14" fill="white" stroke="#0A0A0A" stroke-width="5"/><circle cx="21" cy="24" r="7.5" fill="#0A0A0A"/><circle cx="49" cy="24" r="7.5" fill="#0A0A0A"/></svg>
  </div>
  <h1 class="kicker" style="margin-bottom:14px">Production Hub · Acceso</h1>
  <!-- role="status": este <p> es el único canal de errores de autenticación, así
       que el cambio de texto tiene que anunciarse -->
  <p class="lg-msg" id="lgMsg" role="status" aria-live="polite">Verificando sesión…</p>
  <div id="lgForm" style="display:none">
    <button class="btn" style="width:100%;margin-bottom:2px" onclick="lgGoogle(this)">Continuar con Google</button>
    <div class="lg-or">— O CON MAIL Y CONTRASEÑA —</div>
    <!-- los campos eran placeholder-only: el placeholder no es un label (desaparece
         al tipear y varios lectores no lo anuncian). Label real, oculto a la vista. -->
    <label class="t23-sr" for="lgEmail">Mail</label>
    <input id="lgEmail" type="email" placeholder="tu@mail.com" style="margin-bottom:10px" autocomplete="email">
    <label class="t23-sr" for="lgPass">Contraseña</label>
    <input id="lgPass" type="password" placeholder="Contraseña" style="margin-bottom:12px" autocomplete="current-password" onkeydown="if(event.key==='Enter')lgSignIn(document.getElementById('lgBtn'))">
    <button class="btn primary" id="lgBtn" style="width:100%" onclick="lgSignIn(this)">Entrar</button>
    <button class="btn small" style="width:100%;margin-top:10px" onclick="lgSignUp(this)">Crear cuenta (primera vez)</button>
  </div>
  <div style="margin-top:16px;text-align:center">
    <a href="/privacidad" style="font-size:11.5px;color:var(--gray,#777);text-decoration:none">Política de privacidad</a>
  </div>
</div>
<div class="lg-toast" id="lgToast" role="status" aria-live="polite"></div>
<script src="design-system/config.js"></script>
<script>
const $ = s=>document.querySelector(s);
let sb = null, routed = false;
function toast(m, err){ const t=$("#lgToast"); t.textContent=m; t.className="lg-toast"+(err?" err":""); t.style.display="block"; setTimeout(()=>t.style.display="none", 4000); }
async function routeByRole(session){
  if(routed) return; routed = true;
  $("#lgForm").style.display = "none";
  $("#lgMsg").textContent = "Entrando…";
  try{
    const { data, error } = await sb.from("profiles").select("role").eq("id", session.user.id).single();
    if(error) throw error;
    location.replace(data.role === "interno" ? "/productores" : "/proveedores");
  }catch(e){
    routed = false;
    $("#lgMsg").textContent = "No pude verificar tu cuenta ("+e.message+"). Probá recargar.";
  }
}
async function init(){
  if(!CONFIG.SUPABASE_URL){ $("#lgMsg").textContent = "Login sin configurar (falta Supabase en CONFIG)."; return; }
  try{
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data:{ session } } = await sb.auth.getSession();
    if(session){ routeByRole(session); return; }
    sb.auth.onAuthStateChange((ev, s)=>{ if(s) routeByRole(s); });
    $("#lgMsg").textContent = "Ingresá con tu cuenta.";
    $("#lgForm").style.display = "block";
  }catch(e){ $("#lgMsg").textContent = "No pude conectar con el login ("+e.message+"). Recargá la página."; }
}
function lgCreds(){
  const email = $("#lgEmail").value.trim(), password = $("#lgPass").value;
  if(!email || !password){ toast("Completá mail y contraseña", true); return null; }
  return { email, password };
}
async function lgSignIn(btn){
  const c = lgCreds(); if(!c) return;
  btn.disabled = true; btn.textContent = "Entrando…";
  try{
    const { data, error } = await sb.auth.signInWithPassword(c);
    if(error) throw error;
    if(data.session) routeByRole(data.session);
  }catch(e){
    toast(/invalid/i.test(e.message) ? "Mail o contraseña incorrectos" : "No pude entrar: "+e.message, true);
    btn.disabled = false; btn.textContent = "Entrar";
  }
}
async function lgSignUp(btn){
  const c = lgCreds(); if(!c) return;
  if(c.password.length < 6){ toast("La contraseña necesita al menos 6 caracteres", true); return; }
  btn.disabled = true; btn.textContent = "Creando…";
  try{
    const { data, error } = await sb.auth.signUp({ ...c, options:{ emailRedirectTo: location.origin + "/login" } });
    if(error) throw error;
    if(data.session){ routeByRole(data.session); return; }
    $("#lgForm").style.display = "none";
    $("#lgMsg").textContent = "Cuenta creada. Revisá tu mail para confirmarla y después entrá con tu contraseña.";
  }catch(e){
    toast("No pude crear la cuenta: "+e.message, true);
    btn.disabled = false; btn.textContent = "Crear cuenta (primera vez)";
  }
}
async function lgGoogle(btn){
  btn.disabled = true;
  try{
    await sb.auth.signInWithOAuth({ provider:"google", options:{ redirectTo: location.origin + "/login" } });
  }catch(e){ toast("No pude iniciar con Google: "+e.message, true); btn.disabled = false; }
}
init();
</script>
</body>
</html>
